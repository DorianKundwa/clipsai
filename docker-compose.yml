services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
    image: clipsai-studio:latest
    ports:
      - "${STUDIO_PORT:-7860}:7860"
    env_file:
      - path: .env
        required: false
    environment:
      CLIPSAI_OUTPUT_DIR: /app/outputs
      HF_HOME: /app/.cache/huggingface
      TORCH_HOME: /app/.cache/torch
      NLTK_DATA: /app/.cache/nltk_data
    volumes:
      - ./outputs:/app/outputs
      - clipsai-cache:/app/.cache
    restart: unless-stopped

volumes:
  clipsai-cache:
